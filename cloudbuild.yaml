steps:
  # 1. Build the container image via Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/moltalpha:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/moltalpha:latest', '.']

  # 2. Push the container image to Google Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/moltalpha:latest']

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'moltalpha'
      - '--image'
      - 'gcr.io/$PROJECT_ID/moltalpha:latest'
      - '--region'
      - 'us-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/moltalpha:latest'
  - 'gcr.io/$PROJECT_ID/moltalpha:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
