[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".venv", "venv", "moltbook_alpha_phase1", ".git", "__pycache__"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "venv",
    ".git",
    "__pycache__",
    "moltbook_alpha_phase1",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W291"]
