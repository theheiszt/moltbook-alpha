[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["moltbook_alpha_phase1", ".git", "__pycache__"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "moltbook_alpha_phase1",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W291"]
