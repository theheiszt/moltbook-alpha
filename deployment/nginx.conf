# Moltbook Alpha Production Reverse Proxy Configuration (Nginx / OpenResty)
# Enforces TLS 1.3 termination, client IP attribution, and edge security boundaries.

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Edge Rate Limiting Zones (Defense-in-Depth before reaching FastAPI)
    limit_req_zone $binary_remote_addr zone=api_edge_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=payments_edge_limit:10m rate=10r/m;

    # Upstream Moltbook Alpha Internal Listener (127.0.0.1 ONLY, never 0.0.0.0)
    upstream moltbook_backend {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Redirect all plain HTTP traffic to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name api.moltbook.ai;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Hardened HTTPS Reverse Proxy
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.moltbook.ai;

        # TLS 1.2 & 1.3 Strong Cipher Suites
        ssl_certificate /etc/letsencrypt/live/api.moltbook.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.moltbook.ai/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

        # Prohibit access to internal files and hidden directories
        location ~ /\. {
            deny all;
            return 404;
        }

        # Payment Verification Endpoint (Strict edge throttling)
        location /v1/payments/verify-solana {
            limit_req zone=payments_edge_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://moltbook_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # CRITICAL SECURITY: Replace untrusted client X-Forwarded-For with authentic edge IP
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host $host;

            proxy_connect_timeout 5s;
            proxy_read_timeout 25s;
        }

        # General API Endpoints
        location / {
            limit_req zone=api_edge_limit burst=15 nodelay;
            limit_req_status 429;

            proxy_pass http://moltbook_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # CRITICAL SECURITY: Strip client-forged headers and inject authentic remote_addr
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host $host;

            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }
    }
}
